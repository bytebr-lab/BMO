<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar | Portal BMO</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-bg">
  <main class="auth-card">
    <a class="back" href="index.html">← Voltar ao portal</a>
    <img class="auth-crest" src="assets/brasao-bmo.jpg" alt="Brasão BMO">
    <span class="kicker">ÁREA RESTRITA</span>
    <h1>Acesse sua conta</h1>
    <p class="muted">Entre com o e-mail e a senha cadastrados.</p>

    <form id="login-form">
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="username" required>

      <label for="password">Senha</label>
      <input id="password" type="password" autocomplete="current-password" required>

      <button class="btn btn-block" type="submit">Entrar</button>
      <p id="login-form-message" class="form-message" role="status"></p>
    </form>

    <p class="auth-bottom">Esqueceu a senha? <a href="#" id="reset-password-link">Recuperar por e-mail</a>.</p>
    <p class="auth-bottom">Primeiro acesso? <a href="solicitar-acesso.html">Solicite seu cadastro</a>.</p>
  </main>

  <script type="module" src="js/login.js"></script>
</body>
</html>
